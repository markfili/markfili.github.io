<!DOCTYPE html>
<html lang="hr">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Arilus, obrt za informatičke usluge, Zagreb.">
  <meta name="theme-color" content="#07070a">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Arilus">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Arilus</title>
  <link rel="manifest" href="manifest.json">

  <!-- Start the big downloads from the HTML, before any script runs. -->
  <link rel="preload" href="main.dart.js" as="script">
  <link rel="preload" href="assets/assets/images/logo.png" as="image">
  <link rel="preload" href="assets/assets/fonts/DMMono-Light.ttf" as="font" type="font/ttf" crossorigin>
  <script>
    // Mirror flutter.js: Chromium browsers get the slimmer CanvasKit build.
    (function () {
      var chromium = (navigator.vendor === 'Google Inc.' || navigator.userAgent.indexOf('Edg/') !== -1)
        && typeof Intl.v8BreakIterator !== 'undefined'
        && typeof Intl.Segmenter !== 'undefined'
        && typeof ImageDecoder !== 'undefined';
      var dir = chromium ? 'canvaskit/chromium/' : 'canvaskit/';
      var wasm = document.createElement('link');
      wasm.rel = 'preload'; wasm.as = 'fetch'; wasm.crossOrigin = 'anonymous';
      wasm.href = dir + 'canvaskit.wasm';
      var js = document.createElement('link');
      js.rel = 'modulepreload'; js.href = dir + 'canvaskit.js';
      document.head.appendChild(wasm);
      document.head.appendChild(js);
    })();
  </script>

  <style>
    html, body { margin: 0; height: 100%; background: #07070a; }
    @font-face {
      font-family: "DM Mono";
      font-weight: 300;
      font-display: block;
      src: url(assets/assets/fonts/DMMono-Light.ttf) format("truetype");
    }
    /* Same sky and the same centered brand as the Flutter home page, shown
       at first byte and crossfaded out once Flutter paints its first frame. */
    #splash {
      position: fixed; inset: 0; z-index: 1; pointer-events: none;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: linear-gradient(#07070a, #1b1517);
      opacity: 1; transition: opacity 1.4s ease-out;
    }
    #splash img { width: 88px; height: 88px; display: block; }
    #splash span {
      font: 300 56px/1.15 "DM Mono", ui-monospace, Menlo, monospace;
      letter-spacing: -2px; color: rgba(255, 255, 255, 0.9);
    }
  </style>
</head>
<body>
  <div id="splash" aria-hidden="true">
    <img src="assets/assets/images/logo.png" alt="">
    <span>arilus</span>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var splash = document.getElementById('splash');
      if (!splash) return;
      splash.style.opacity = '0';
      setTimeout(function () { splash.remove(); }, 1500);
    }, { once: true });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
